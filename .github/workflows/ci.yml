name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout casablanca
        uses: actions/checkout@v4
        with:
          path: casablanca

      # proof-sdk is a sibling workspace consumed via `link:../proof-sdk`.
      # Without it, pnpm install fails. CI mirrors the local layout.
      - name: Checkout proof-sdk (sibling)
        uses: actions/checkout@v4
        with:
          repository: minkyojung/proof-sdk
          path: proof-sdk

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: casablanca/pnpm-lock.yaml

      # Skip postinstall here — binaries setup is needed only for the
      # Rust/Tauri build, not for vite typecheck/build/test. postinstall only
      # fetches the pinned bun used by the sidecar at runtime; the vitest suite
      # runs in jsdom and the two test files touching @tauri-apps both mock it.
      - name: pnpm install (skip postinstall)
        working-directory: casablanca
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (writer-tauri)
        working-directory: casablanca
        run: pnpm --filter writer-tauri lint

      - name: Typecheck (writer-tauri)
        working-directory: casablanca
        run: pnpm --filter writer-tauri typecheck

      # ~1000 tests in 17 seconds, no network, no secrets — the textbook
      # presubmit suite. It had never run here, which is how five sidecar
      # harnesses came to be completely dead without anyone noticing.
      #
      # No `retry`. Vitest re-runs a failed test in a DIFFERENT state, so for the
      # one failure mode we've actually observed here — passes alone, failed once
      # under a heavily loaded parallel run — a retry would reliably mask the
      # isolation bug rather than report it. If retry is ever added, every
      # retry-pass has to be reported as a defect signal (Shopify's guardrail),
      # otherwise it just converts an actionable red into silence.
      - name: Test (writer-tauri)
        working-directory: casablanca
        run: pnpm --filter writer-tauri test

      - name: Build (writer-tauri vite)
        working-directory: casablanca
        run: pnpm --filter writer-tauri build

  rust:
    name: Rust (test)
    # macOS, not ubuntu. Seven source files are behind `cfg(target_os = "macos")`
    # — lib.rs, window_chrome.rs, manager.rs, updater.rs, os_trash.rs, sound.rs,
    # reveal.rs — so a green on linux would leave the platform half of the crate
    # unbuilt. It also matches what we actually ship.
    runs-on: macos-latest
    steps:
      - name: Checkout casablanca
        uses: actions/checkout@v4
        with:
          path: casablanca

      - name: Checkout proof-sdk (sibling)
        uses: actions/checkout@v4
        with:
          repository: minkyojung/proof-sdk
          path: proof-sdk

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: casablanca/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: casablanca/apps/writer-tauri/src-tauri

      # `tauri_build::build()` runs from build.rs and validates the bundle
      # config on EVERY cargo subcommand, so `check`, `test` and a real bundle
      # all need the same three inputs present. None of them are in git, and
      # missing any one of them fails before a single test compiles.
      #
      # 1/3 — the pinned bun, fetched by writer-tauri's postinstall. The
      # frontend job skips scripts because vitest doesn't need it; we do.
      - name: pnpm install
        working-directory: casablanca
        run: pnpm install --frozen-lockfile

      # 2/3 — sidecar-pkg, the Resource the bundler ships. Packing it here also
      # exercises the pack script itself, which is otherwise only ever run on a
      # release build — the one path that can go stale without anyone noticing.
      - name: Pack sidecar
        working-directory: casablanca
        run: pnpm --filter writer-tauri pack:sidecar

      # 3/3 — the Google OAuth client, read at compile time by `include_str!`.
      # Gitignored, and CI has no business holding the real one: nothing under
      # test performs a Google OAuth exchange, so placeholders satisfy the
      # compiler without putting a credential on a runner.
      - name: Write placeholder Google OAuth secrets
        working-directory: casablanca/apps/writer-tauri/src-tauri
        run: |
          mkdir -p secrets
          echo "ci-placeholder-not-a-real-client-id" > secrets/google_client_id
          echo "ci-placeholder-not-a-real-secret" > secrets/google_client_secret

      # The suite this job exists for. It had been uncompilable — and therefore
      # silently not running — for long enough that a deleted function's tests
      # were still referencing it; `cargo check` without `--tests` passes in
      # that state, so nothing local caught it either.
      #
      # Not gated on clippy: the crate carries pre-existing lints (complex
      # types in the JSON-RPC plumbing), so `-D warnings` would be red on day
      # one and teach everyone to ignore this job.
      - name: Test (writer-tauri Rust)
        working-directory: casablanca/apps/writer-tauri/src-tauri
        run: cargo test --locked
