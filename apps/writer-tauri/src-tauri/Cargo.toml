[package]
name = "writer-tauri"
version = "0.1.0"
description = "Wiki-LLM Writer"
authors = []
edition = "2021"

[lib]
name = "writer_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
aes-gcm = "0.10"
machine-uid = "0.5"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "time", "rt"] }
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSVisualEffectView wrapper. Apply_vibrancy injects a frosted-glass
# layer below the WebView contentView so window-transparent gaps
# (sidebar's floating inset, SidebarInset's pt-3 top strip) take on
# the macOS Tahoe vibrancy tone instead of a flat fill.
window-vibrancy = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
